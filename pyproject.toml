[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outerloop-quickstart"
dynamic = ["version"]
description = "Two small, deterministic, CPU-only benchmarks for a first Outerloop run"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Agentic Learning AI Lab, New York University" }]
dependencies = ["numpy>=2"]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8"]

[tool.hatch.version]
path = "src/quickstart/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quickstart"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
